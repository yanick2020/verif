<body class="verification-page">

    <!-- Barre du haut -->
    <header class="topbar">

        <div class="mybeauty-brand">
            <div class="mybeauty-name">VoucherChecker</div>
            <div class="mybeauty-tagline">
                Service de vérification en ligne
            </div>
        </div>

    </header>

    <div class="background-shape shape1"></div>
    <div class="background-shape shape2"></div>

    <main>

        <section class="verification-card">

            <div class="verification-header">
                <h1>Vérification d'un voucher</h1>
            </div>

            <div class="verification-body">

                <form id="verificationForm">

                    <div class="code-group">

                        <input
                            type="text"
                            id="part1"
                            name="part1"
                            maxlength="4"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 1">

                        <input
                            type="text"
                            id="part2"
                            name="part2"
                            maxlength="3"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 2">

                        <input
                            type="text"
                            id="part3"
                            name="part3"
                            maxlength="3"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 3">

                    </div>

                    <div class="recaptcha-container">
                        <div
                            class="g-recaptcha"
                            data-sitekey="6LcCNZ0tAAAAAOnp5c4evfG-58R0Q78vZbQ9_9pL">
                        </div>
                    </div>

                    <button type="submit" id="verifyBtn">
                        Soumettre
                    </button>

                </form>

                <div id="result"></div>

            </div>

        </section>

    </main>
